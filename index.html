<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伟世通武汉研发中心揭幕庆典 · 3D基础白模</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231f3a93'/><path d='M8 22V12l8-5 8 5v10h-5v-6h-6v6z' fill='white'/></svg>">
<style>
  :root{
    --ink:#1a2233; --panel:rgba(255,255,255,.92); --line:#d8dee8;
    --blue:#1f3a93; --muted:#6b7688;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* 顶部标题 */
  header{position:fixed;top:0;left:0;right:0;z-index:20;padding:14px 20px;display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.75) 70%,transparent);pointer-events:none}
  header .logo{width:34px;height:34px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
  header .logo svg{width:20px;height:20px}
  header h1{font-size:16px;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px}
  header .stage-tag{margin-left:auto;font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--muted);pointer-events:auto}

  /* 控制面板 */
  .panel{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(20,30,50,.08)}
  #viewPanel{left:20px;top:84px;width:200px}
  #layerPanel{left:20px;bottom:20px;width:200px}
  .panel h2{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:10px}
  .vbtn{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:6px;border:1px solid var(--line);
    background:#fff;border-radius:9px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;color:var(--ink)}
  .vbtn:hover{border-color:var(--blue);color:var(--blue)}
  .vbtn.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .vbtn:last-child{margin-bottom:0}
  .layer-row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;cursor:pointer}
  .layer-row input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
  .swatch{width:10px;height:10px;border-radius:3px;flex:none}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
  .seg button{flex:1;border:0;background:#fff;padding:8px 0;font-size:12px;cursor:pointer;font-family:inherit;color:var(--muted)}
  .seg button.on{background:var(--blue);color:#fff}

  /* 提示 */
  #hint{position:fixed;right:20px;bottom:20px;z-index:20;font-size:12px;color:var(--muted);text-align:right;line-height:1.7;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:240px}
  #hint b{color:var(--ink)}
  /* 加载 */
  #loading{position:fixed;inset:0;z-index:50;background:#f2f4f8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #loading .spin{width:38px;height:38px;border:3px solid #d4dae6;border-top-color:var(--blue);border-radius:50%;animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  /* 标签 */
  .label{font-size:12px;font-weight:600;color:#16203a;background:rgba(255,255,255,.88);border:1px solid #cfd8ea;
    padding:2px 8px;border-radius:12px;white-space:nowrap;transform:translateY(-6px);box-shadow:0 2px 8px rgba(20,30,50,.08)}
  .label.big{font-size:13px;font-weight:700;background:var(--blue);color:#fff;border-color:var(--blue)}
  .label.org{color:#b3540f;border-color:#f0c49b}
  @media (max-width:720px){
    #layerPanel,#hint{display:none}
    #viewPanel{width:168px}
    header h1{font-size:14px}
  }
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><div style="font-size:13px;color:#6b7688">正在搭建3D基础模型…</div></div>
<div id="app"></div>

<header>
  <div class="logo"><svg viewBox="0 0 32 32"><path d="M7 24V11l9-5 9 5v13h-6v-7h-6v7z" fill="white"/></svg></div>
  <div>
    <h1>伟世通武汉研发中心 · 揭幕庆典</h1>
    <div class="sub">3D 基础白模 · 按总平图真实比例（1 单位 = 1 米）</div>
  </div>
  <div class="stage-tag">阶段三：精确尺寸</div>
</header>

<div class="panel" id="viewPanel">
  <h2>视角</h2>
  <button class="vbtn active" data-view="overview">全景鸟瞰</button>
  <button class="vbtn" data-view="gate">新楼正门主视角</button>
  <button class="vbtn" data-view="stage">舞台与观众区</button>
  <button class="vbtn" data-view="photo">合影区</button>
  <button class="vbtn" data-view="booth">展位区</button>
</div>

<div class="panel" id="layerPanel">
  <h2>图层 / 显示</h2>
  <label class="layer-row"><input type="checkbox" data-layer="buildings" checked><span class="swatch" style="background:#e8ebf2"></span>建筑楼体</label>
  <label class="layer-row"><input type="checkbox" data-layer="event" checked><span class="swatch" style="background:#c9a86a"></span>活动布置</label>
  <label class="layer-row"><input type="checkbox" data-layer="green" checked><span class="swatch" style="background:#7fae6a"></span>绿地绿植</label>
  <label class="layer-row"><input type="checkbox" data-layer="flags" checked><span class="swatch" style="background:#2f56c0"></span>道旗</label>
  <label class="layer-row"><input type="checkbox" data-layer="labels" checked><span class="swatch" style="background:#9aa6c0"></span>文字标签</label>
  <h2 style="margin-top:14px">材质模式</h2>
  <div class="seg">
    <button id="modeWhite" class="on">白模</button>
    <button id="modeColor">功能配色</button>
  </div>
  <h2 style="margin-top:14px">篷房篷布</h2>
  <button id="tentBtn" class="vbtn" style="text-align:center;margin-bottom:0">篷布：半透明</button>
</div>

<div id="hint">
  <b>操作</b>：左键旋转 · 右键平移 · 滚轮缩放<br>
  <b>阶段三</b>：E1 三层 15.85m、F1 24m；挑檐深 8.2m、下高 4m；LED 主屏 8×4 + 副屏 2.5×4 两块；15m 尖顶篷房；铁艺栅栏围合。
</div>

  }
}
</script>

/* ===== 材质（白模 / 功能配色两套） ===== */
function std(color, rough = 0.7, metal = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
}
// 玻璃幕墙（物理材质，半透明 + 清漆反射）
function glassMaterial(color, opacity) {
  return new THREE.MeshPhysicalMaterial({
    color, roughness: 0.14, metalness: 0.28,
    transparent: true, opacity, clearcoat: 0.7, clearcoatRoughness: 0.22,
  });
}
// LED 屏（深色，功能配色下带蓝色自发光）
function ledMaterial(color, emissive) {

    color, roughness: 0.32, metalness: 0.35,
    emissive, emissiveIntensity: emissive ? 0.6 : 0,

/* ===== 分组 ===== */
const G = {

/* ===== 建模辅助 ===== */
// 拉伸体（多边形点，高度，材质键，底标高）
function extrude(points, height, matKey, baseY = 0) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], -points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], -points[i][1]);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, getMat(matKey));
  mesh.position.y = baseY;
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData.mat = matKey;
  return mesh;
}
// 平面多边形（y 为标高）
function flatShape(points, matKey, y = 0.02) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], -points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], -points[i][1]);
  shape.closePath();

  [0.4,1.8].forEach(y=>{
    const rail=new THREE.Mesh(new THREE.BoxGeometry(run,0.08,0.08),getMat('fence'));
    rail.position.set(t0+run/2,y,0);rail.userData.mat='fence';grp.add(rail);
  });
  // 镂空装饰竖杆（每 0.8m）
  for(let t=t0+0.4;t<t1;t+=0.8){
    const bar=new THREE.Mesh(new THREE.BoxGeometry(0.04,1.4,0.04),getMat('fence'));
    bar.position.set(t,1.1,0);bar.userData.mat='fence';grp.add(bar);
  }
  fenceGroup.add(grp);
}
// 各段（西界道闸、东界栅栏门处拆成两段）
fenceRun(P0,P1,0,Math.hypot(P1[0]-P0[0],P1[1]-P0[1]));
fenceRun(P1,P2,0,Math.hypot(P2[0]-P1[0],P2[1]-P1[1]));
const W_LEN=P3[1]-P2[1];

fenceRun(P2,P3,13.64-P2[1],W_LEN);         // 西界道闸南
fenceRun(P3,P4,0,Math.hypot(P4[0]-P3[0],P4[1]-P3[1]));
fenceRun(P4,P5,0,Math.hypot(P5[0]-P4[0],P5[1]-P4[1]));
fenceRun(P5,P6,0,Math.hypot(P6[0]-P5[0],P6[1]-P5[1]));
const E_LEN=P6[1]-P0[1];
fenceRun(P6,P0,0,P6[1]-5.71);              // 东界栅栏门南
fenceRun(P6,P0,P6[1]-2.48,E_LEN);          // 东界栅栏门北

/* —— 西界停车道闸（开口 x-33.81、z9.03~13.64） —— */
const BARRIER = new THREE.Group();
fenceGroup.add(BARRIER);
[9.03,13.64].forEach(z=>{

const bArm=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,4.4),getMat('orange'));
bArm.position.set(-33.81,1.0,11.335);bArm.userData.mat='orange';bArm.castShadow=true;

for(let z=9.6;z<13.4;z+=0.9){
  const seg=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.4),getMat('mark'));
  seg.position.set(-33.81,1.0,z);seg.userData.mat='mark';BARRIER.add(seg);
}

/* —— 东界铁艺栅栏门（开口 x20.37、z2.48~5.71，两扇对开、向内开启） —— */
const GATE = new THREE.Group();
fenceGroup.add(GATE);
[2.48,5.71].forEach(z=>GATE.add(box(20.37,z,0.16,0.16,2,'fence',0)));
[2.48,5.71].forEach((z,i)=>{
  const leaf=new THREE.Group();
  leaf.position.set(20.37,0,z);
  const dir=i===0?1:-1;
  // 门框：两侧立柱 + 上下横杆
  const post0=new THREE.Mesh(new THREE.BoxGeometry(0.08,1.9,0.08),getMat('fence'));
  post0.position.y=0.95;post0.userData.mat='fence';leaf.add(post0);
  const post1=new THREE.Mesh(new THREE.BoxGeometry(0.08,1.9,0.08),getMat('fence'));
  post1.position.set(0,0.95,dir*1.5);post1.userData.mat='fence';leaf.add(post1);
  [0.15,1.75].forEach(y=>{
    const rail=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,1.5),getMat('fence'));
    rail.position.set(0,y,dir*0.75);rail.userData.mat='fence';leaf.add(rail);
  });
  // 中间镂空竖杆（4 根）
  for(let k=1;k<5;k++){
    const bar=new THREE.Mesh(new THREE.BoxGeometry(0.045,1.5,0.045),getMat('fence'));
    bar.position.set(0,0.95,dir*1.5*k/5);bar.userData.mat='fence';leaf.add(bar);
  }
  leaf.rotation.y = i===0? -0.7 : 0.7;   // 向内（西侧）开启约 40°
  GATE.add(leaf);
});

/* ===== 道旗（35 个） ===== */
function makeFlag(x, z) {
  const grp = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 5, 8), getMat('metal'));
  pole.position.y = 2.5; pole.userData.mat = 'metal';
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.55), getMat('blue'));
  flag.position.set(0.45, 4.6, 0); flag.userData.mat = 'blue';
  grp.add(pole, flag);
  grp.position.set(x, 0, z);
  return grp;
}
D.flags.forEach(f => G.flags.add(makeFlag(f[0], f[1])));

/* ===== 文字标签 ===== */
makeLabel('E1栋 · 研发主楼（3层 15.85m）', 0, -8, 16.6, 'big');

makeLabel('展位②', 16.9, 17.4, 3.2, 'org');

/* ===== 光照：主光 + 半球环境 + 天空补光 ===== */
scene.add(new THREE.HemisphereLight(0xffffff, 0xc8cfdb, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(45, 70, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -85; sun.shadow.camera.right = 85;
sun.shadow.camera.top = 85; sun.shadow.camera.bottom = -85;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 220;
sun.shadow.bias = -0.0004;

fill.position.set(-40, 30, -30);

/* ===== 视角预设（带过渡） ===== */
const VIEWS = {
  overview: { pos: [48, 62, 88], tgt: [6, 0, 12] },
  gate: { pos: [-13, 11, 22], tgt: [0, 4.5, -2] },
  stage: { pos: [-2, 9, 30], tgt: [0, 3, 8] },
  photo: { pos: [-32, 8, 11], tgt: [-15, 3, 3] },
  booth: { pos: [34, 12, 20], tgt: [17, 2, 17] },
};
let moving = false;
const targetPos = new THREE.Vector3(), targetTgt = new THREE.Vector3();
document.querySelectorAll('.vbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!btn.dataset.view) return;   // 篷布按钮复用 vbtn 样式但不是视角按钮
    document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const v = VIEWS[btn.dataset.view];
    targetPos.set(...v.pos); targetTgt.set(...v.tgt);
    moving = true;
  });
});

/* ===== 图层开关 ===== */
document.querySelectorAll('[data-layer]').forEach(cb => {
  cb.addEventListener('change', () => {
    const k = cb.dataset.layer;
    if (k === 'labels') G.labels.visible = cb.checked;
    else G[k].visible = cb.checked;
  });
});

/* ===== 材质模式切换 ===== */
function applyMode() {
  scene.traverse(o => {
    if (o.isMesh || o.isInstancedMesh) {
      const k = o.userData.mat;
      if (k && MAT[mode][k]) o.material = MAT[mode][k];
    }
  });
}
function bindMode(id, m) {
  document.getElementById(id).addEventListener('click', () => {
    mode = m;
    document.getElementById('modeWhite').classList.toggle('on', m === 'white');
    document.getElementById('modeColor').classList.toggle('on', m === 'color');
    applyMode();
  });
}
bindMode('modeWhite', 'white');
bindMode('modeColor', 'color');

/* ===== 篷布切换（半透明 → 实体白色 → 隐藏 → 半透明） ===== */
const TENT_STATES=[
  {label:'篷布：半透明',opacity:0.35,visible:true},
  {label:'篷布：实体白色',opacity:1,visible:true},
  {label:'篷布：隐藏',opacity:1,visible:false},
];
let tentState=0;
const tentBtn=document.getElementById('tentBtn');
tentBtn.addEventListener('click',()=>{
  tentState=(tentState+1)%TENT_STATES.length;
  const s=TENT_STATES[tentState];
  tentCloth.visible=s.visible; tentMat.opacity=s.opacity;
  tentBtn.textContent=s.label;
});

/* ===== 自适应 ===== */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* ===== 渲染循环（切后台暂停） ===== */
let running = true;
document.addEventListener('visibilitychange', () => {
  const wasHidden = document.hidden;
  running = !wasHidden;
  if (running) loop();
});
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  if (moving) {
    camera.position.lerp(targetPos, 0.09);
    controls.target.lerp(targetTgt, 0.09);
    if (camera.position.distanceTo(targetPos) < 0.3 &&
        controls.target.distanceTo(targetTgt) < 0.3) moving = false;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
loop();
document.getElementById('loading').style.display = 'none';
</script>
